name: Release

on:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing tag to (re)publish to npm, e.g. v0.1.1. Leave empty for a normal release run."
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node

  publish:
    needs: release-please
    # Normal path: release-please just cut a release. Recovery path: a manual
    # dispatch naming an existing tag whose npm publish failed — retrying must
    # never require minting a new version.
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.publish_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish_tag }} # empty = the triggering commit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run smoke
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false # never cache in release builds
      # No registry-url: setup-node would write an .npmrc pinning
      # _authToken=${NODE_AUTH_TOKEN} unconditionally, and an unset var leaves
      # an empty credential that defeats the OIDC exchange. Default registry
      # is registry.npmjs.org anyway.
      - name: OIDC preflight
        run: |
          echo "npm            : $(npm --version)  (trusted publishing needs >= 11.5.1)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then oidc=present; else oidc=MISSING; fi
          echo "OIDC token url : $oidc"
          echo "npm userconfig : ${NPM_CONFIG_USERCONFIG:-<unset>}"
          echo "registry       : $(npm config get registry)"
          echo "repository.url : $(node -p "require('./package.json').repository.url")"
      # Tokenless: npm exchanges the Actions OIDC token for a short-lived
      # publish credential via the trusted publisher configured on npmjs.com
      # (andrew-nguyen/omp-smart-approve, workflow release.yml, allowed action
      # "npm publish"). Provenance is automatic under trusted publishing.
      - run: npm publish --access public
